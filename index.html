/* запрет выделения и системного меню при долгом нажатии (кроме полей ввода) */

:root{--bg:#0a0605;--tx:#f4eee9;--mu:rgba(244,238,233,.52);--ac:#ff7a2f;--a1:#ff8a3d;--a2:#d4400f;--al:#ffb27a;--ag:rgba(255,106,31,.35);--ag2:rgba(255,138,61,.65);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--ln:transparent;--c1:#e8660f;--c2:#c81c00;--g1:#e8660f;--g2:#c81c00;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.25,.5,1);color-scheme:dark;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@property --c1{syntax:'<color>';inherits:true;initial-value:#e8660f}
@property --c2{syntax:'<color>';inherits:true;initial-value:#c81c00}

.page.cc{transition:opacity .38s cubic-bezier(.32,.72,0,1),--ca 1s ease,--c1 1s ease,--c2 1s ease}
body.fx #view .glass,body.fx .dock.glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.poster:active,.row:active,.hc:active{transform:scale(.965);transition-duration:.15s}
#veil{position:fixed;inset:0;z-index:25;background:#030201;opacity:0;pointer-events:none}
body.pgo #view,body.pgo .dock{visibility:hidden}
.cover.c0{z-index:-1;-webkit-mask-image:none;mask-image:none}
.cover.c0::after{display:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:transparent;color:var(--tx);font-family:"Inter Tight",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:120px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#030201}
.o{position:absolute;border-radius:50%;opacity:.85;will-change:transform}
.o1{width:80vmax;height:70vmax;right:-40vmax;bottom:-24vmax;background:radial-gradient(circle,var(--g1),transparent 66%);animation:d2 20s ease-in-out infinite alternate;opacity:.5}
.o,.o2,.o3{display:none!important}
@property --hg1{syntax:'<color>';inherits:true;initial-value:#2a1a10}
@property --hg2{syntax:'<color>';inherits:true;initial-value:#120a06}
.bg{transition:--hg1 1.2s ease,--hg2 1.2s ease}
.bg::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;

.bg.hg::before{opacity:var(--hgo,0)}

@keyframes d1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vmax,10vmax) scale(.9)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--ln);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.chip,.mark,.row.glass,.ep.glass{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.chip,.mark{background:rgba(16,9,7,.42)}
.row.glass{background:rgba(255,255,255,.09)}
main{max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
body.tprof main{padding-top:0}
html,body{overscroll-behavior-y:none}
.hero{padding:34px 22px 10px}
.hero small{color:var(--mu);font-size:14px;letter-spacing:.02em}
h1{margin:10px 0 0;font-weight:300;font-size:clamp(38px,11vw,56px);line-height:1.02;letter-spacing:-.035em}
.seg{position:relative;display:inline-flex;margin:22px 22px 6px;padding:4px;border-radius:99px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mu);font:inherit;font-size:14px;padding:8px 13px;border-radius:99px;transition:color .4s var(--ease),transform .45s var(--ease)}
.seg button.on{color:var(--tx)}
.seg button:active,.chipb:active{transform:scale(.94)}
.sl{position:absolute;left:0;top:0;width:0;height:0;border-radius:99px;background:var(--glass2);border:0;outline:0;box-shadow:none;pointer-events:none;opacity:0;z-index:0;will-change:transform,width;transition:transform .55s cubic-bezier(.32,.72,0,1),width .55s cubic-bezier(.32,.72,0,1),height .55s cubic-bezier(.32,.72,0,1),opacity .25s}
.seg.glass,.secs{box-shadow:none;border-color:transparent}
#dseg,#fseg{display:flex;width:fit-content;max-width:calc(100% - 44px);padding:0;margin:22px 22px 0;border-radius:0}
#fseg{margin-top:6px;margin-bottom:6px}
#dseg button,#fseg button{padding:8px 20px 8px 0}
#fseg button{font-size:13.5px}

.seg em{font-style:normal;color:var(--mu);font-size:12px;margin-left:5px}
.seg button.nb::after{content:"";position:absolute;top:7px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ag2)}
#dseg,#fseg{margin-left:22px}
.fsum{display:flex;align-items:center;gap:8px;margin:18px 22px 2px;height:36px;padding:0;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;outline:0;-webkit-appearance:none;appearance:none;transition:transform .45s var(--ease)}
.fsum:active{transform:scale(.96)}
.fsum b{font-weight:500}.fsum b+i+b{color:var(--mu)}
.fsum i{font-style:normal;color:rgba(244,238,233,.3)}
.fsum svg{width:14px;height:14px;stroke:var(--mu);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease);margin-left:2px}
.fsum.open svg{transform:rotate(180deg)}
.ffold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),opacity .4s var(--ease)}
.ffold.open{grid-template-rows:1fr;opacity:1}
.ffold>div{overflow:hidden;min-height:0}
.ffold:not(.open){pointer-events:none}
.ffold .seg{margin:6px 22px 0 5px}.ffold .secs{padding-left:6px;padding-top:4px}
.ffold .sl{display:none}
.ffold .seg{padding:0;margin:4px 22px 0}

#aiq{all:unset;display:block;flex:1;min-width:0;align-self:center;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.35;color:var(--tx);max-height:132px;padding:8px 0;overflow-y:auto;caret-color:var(--ac);-webkit-user-select:text;user-select:text;white-space:pre-wrap;word-break:break-word}
#aiq::placeholder{color:rgba(244,238,233,.6)}
.aisb{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;color:rgba(244,238,233,.9);background:transparent;transition:background .4s,transform .4s var(--spring),color .3s}
.aisb svg{grid-area:1/1;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:none}
.aisb[data-m="send"] .i-s,.aisb[data-m="idle"] .i-s,.aisb[data-m="stop"] .i-x{display:block}
.aisb[data-m="send"]{background:linear-gradient(160deg,var(--a1),var(--a2));color:var(--on,#fff);box-shadow:0 6px 20px var(--ag)}
.aisb[data-m="stop"]{background:rgba(255,255,255,.16)}
.aisb:active{transform:scale(.9)}
.aisb.rec{color:var(--al);background:rgba(255,255,255,.12)}
.aisb.rec .i-m path{transform-box:fill-box;transform-origin:center;animation:aiw 1s ease-in-out infinite}
.aisb.rec .i-m path:nth-child(2n){animation-delay:.25s}
.aisb.rec .i-m path:nth-child(3n){animation-delay:.5s}
@keyframes aiw{50%{transform:scaleY(.4)}}
/* настройки */
.aiset{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.aiset.open{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
.aiset .ap2{width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:32px 32px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));background:rgba(28,14,9,.62);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);transform:translateY(50px);transition:transform .65s var(--ease)}
.aiset.open .ap2{transform:none}
.aiset h2{margin:0;font-weight:300;font-size:32px;letter-spacing:-.035em;line-height:1.05}
.aiset .meta{margin:8px 0 14px}
.aiset p{margin:0 0 10px;color:rgba(244,238,233,.75);line-height:1.5;font-size:14.5px}
.aimod{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.aimod button{border:0;background:rgba(255,255,255,.07);color:var(--mu);font:inherit;font-size:13px;padding:9px 14px;border-radius:99px;transition:.35s}
.aimod button.on{color:var(--tx);background:rgba(255,255,255,.18)}
.aiset .btns{display:flex;gap:10px;margin-top:14px}
.aiset .lbl2{margin:16px 0 4px;color:var(--mu);font-size:13px}
@media(prefers-reduced-motion:reduce){.aibg i,.orb,.orb::before,.orb i,.aiw>*,.aia>*,.aiu,.ait,.ait i{animation:none!important}#ai{transition:opacity .2s}}
.aisb:disabled{opacity:.4}
.aisb[data-m="send"]:disabled{background:transparent;box-shadow:none}

/* ===== ЧАТ ИИ v2: клавиатура, края, свечение сферы ===== */
/* фон всегда на весь экран, а контент подгоняется под visualViewport (--vvt/--vvb) */

2. Поиск по описанию сюжета: сначала вспомни 3–8 подходящих тайтлов из своих знаний и одним вызовом search_titles проверь их и получи id. Если не уверен, попробуй discover_titles с темами (themes, по-английски) и фильтрами. Для запросов вроде «лучшие комедии 90-х» или «корейские сериалы» сразу используй discover_titles.
3. Показывая или рекомендуя тайтлы, пиши по одной строке на каждый: **Название** (год) — чем хорош. После списка поставь маркеры [[id]] подряд, по одному на тайтл, например [[m603]] [[t1396]]: приложение превратит их в ленту карточек с постерами. Не пиши id и ссылки иначе. Рекомендуй не больше 6 тайтлов за раз, если не просят больше. Не предлагай то, что уже отмечено как «смотрел» (поле in_diary), если об этом не просили.
4. Просьбы «создай папку», «добавь в папку», «собери подборку» выполняй сразу, без уточнений: подбери 6–10 тайтлов, получи их id, вызови create_folder (или add_to_folder, если папка уже есть). Потом одной-двумя фразами скажи, что сделано, и покажи карточки.
5. Удалять папки и менять дневник можно только по прямой просьбе. Для delete_folder приложение само спросит подтверждение.
6. Если инструмент вернул ошибку, просто и честно объясни, что не получилось.
7. Подробности о тайтле (актёры, режиссёр, сюжет) бери из get_details, а не из памяти.
8. Пользователь может приложить к сообщению фильмы, сериалы, актёров (блок «[Вложения пользователя к сообщению]» со списком и id) и фото. Это основа запроса: например, «подбери похожее по вайбу» значит искать по атмосфере, темам, жанрам, темпу и визуальному стилю приложенного, не повторяя сами приложенные тайтлы. Для подробностей о приложенном вызывай get_details по этим id. Фото разглядывай внимательно (кадр, постер, афиша, скриншот): если по нему можно понять тайтл, найди его через search_titles.`}
