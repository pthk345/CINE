.orb{--s:150px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none}
.orb::before{content:"";position:absolute;inset:-48%;border-radius:50%;background:radial-gradient(circle,var(--ag2) 0%,transparent 62%);opacity:.5;animation:orbg 5.5s ease-in-out infinite}
.orb i{position:absolute;inset:0;border-radius:50%}
.orb .o-c{background:radial-gradient(circle at 50% 56%,rgba(0,0,0,.92) 34%,rgba(0,0,0,.35) 62%,transparent 74%),radial-gradient(circle at 30% 24%,rgba(255,255,255,.3),transparent 36%);box-shadow:inset 0 0 calc(var(--s)*.16) var(--ag2),0 0 calc(var(--s)*.3) var(--ag)}
.orb .o-r{background:conic-gradient(from 0deg,transparent 0 10%,var(--al) 22%,var(--ac) 36%,transparent 52%,var(--a2) 68%,var(--a1) 82%,transparent 95%);-webkit-mask:radial-gradient(circle,transparent 57%,#000 66%,#000 73%,transparent 83%);mask:radial-gradient(circle,transparent 57%,#000 66%,#000 73%,transparent 83%);filter:blur(calc(var(--s)*.014));animation:orbs 9s linear infinite;mix-blend-mode:screen}
.orb .o-r.r2{rotate:70deg;scale:.93;opacity:.78;animation-duration:15s;animation-direction:reverse}
.orb .o-h{inset:6%;background:radial-gradient(ellipse 46% 30% at 36% 22%,rgba(255,255,255,.5),transparent 70%);filter:blur(calc(var(--s)*.03));opacity:.7}
.orb.th{animation:orbp 1.5s ease-in-out infinite}
.orb.th .o-r{animation-duration:2.8s}
.orb.th .o-r.r2{animation-duration:4.4s}
.orb.mini{--s:34px}
.orb.mini::before{inset:-60%;opacity:.4}
@keyframes orbs{to{transform:rotate(360deg)}}
@keyframes orbg{50%{opacity:.8;scale:1.08}}
@keyframes orbp{50%{scale:1.07}}
/* пустое состояние */
.aiw{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;padding:46px 24px 8px;margin-top:-46px;text-align:center}
.aiw>:first-child{margin-top:auto}
.aiw>:last-child{margin-bottom:auto}
#ai.nokey:not(.aichat) .aicw{display:none}
#ai.nokey:not(.aichat) .aiw{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#ai.nokey .aiw .orb{--s:104px;margin-bottom:16px}
#ai.nokey .aiw h1{font-size:clamp(26px,7.2vw,32px)}
.aiw>*{animation:aiup .9s var(--ease) both;animation-delay:calc(var(--n,0)*90ms + .15s)}
@keyframes aiup{from{opacity:0;translate:0 18px;filter:blur(8px)}}
.aiw .orb{margin-bottom:clamp(20px,6vh,54px);transition:--s .5s}
.aiw .hi{font-size:16px;color:var(--mu);margin-bottom:10px}
.aiw h1{margin:0;font-weight:500;font-size:clamp(30px,8.6vw,40px);letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.aisg{display:flex;flex-direction:column;gap:9px;margin-top:clamp(22px,5vh,40px);width:100%;max-width:420px}
.aisg button{border:0;border-radius:99px;padding:13px 18px;font:inherit;font-size:14.5px;color:rgba(244,238,233,.86);text-align:left;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);transition:transform .4s var(--spring),background .4s}
.aisg button:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.aisu{width:100%;max-width:400px;margin-top:clamp(18px,4vh,32px);text-align:left}
.aisu p{margin:0 0 12px;color:rgba(244,238,233,.72);font-size:14.5px;line-height:1.5}
.aisu ol{margin:0 0 14px;padding-left:1.25em;color:rgba(244,238,233,.72);font-size:14.5px;line-height:1.55}
.aisu a,.aiset a{color:var(--al);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--al) 40%,transparent)}
.aisu input.k{margin-top:0}
.aisu .btn{width:100%;margin-top:10px;flex:none}
body.kb .aiw .orb{--s:84px;margin-bottom:12px}
body.kb .aisg{display:none}
/* сообщения */
.aim{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 20px;display:none;flex-direction:column;gap:16px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 26px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(180deg,transparent,#000 26px,#000 calc(100% - 16px),transparent)}
#ai.aichat .aim{display:flex}
#ai.aichat .aiw{display:none}
.aiu{align-self:flex-end;max-width:84%;padding:12px 17px;border-radius:24px 24px 7px 24px;font-size:16px;line-height:1.4;white-space:pre-wrap;word-break:break-word;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:0;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);-webkit-user-select:text;user-select:text;animation:aiin .55s var(--ease) both}
.aia{align-self:stretch;font-size:16.5px;line-height:1.52;color:rgba(244,238,233,.92);word-break:break-word;-webkit-user-select:text;user-select:text}
.aia>*{animation:aiin .8s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
.aia p{margin:0 0 .75em}
.aia p:last-child{margin-bottom:0}
.aia ul,.aia ol{margin:0 0 .75em;padding-left:1.25em}
.aia li{margin:.3em 0}
.aia b{font-weight:600;color:var(--tx)}
.aia code{font-size:.9em;padding:1px 6px;border-radius:7px;background:rgba(255,255,255,.1)}
.aia.er{color:#ffb4a8}
@keyframes aiin{from{opacity:0;translate:0 12px;filter:blur(6px)}}
.ait{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:9px 15px 9px 13px;border-radius:99px;font-size:13px;color:var(--mu);background:rgba(255,255,255,.06);border:0;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:aiin .5s var(--ease) both}
.ait i{width:7px;height:7px;border-radius:50%;background:var(--al);flex:none;animation:aip 1.1s ease-in-out infinite}
.ait span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ait.ok i{animation:none;background:#5be3a0}
.ait.er i{animation:none;background:#ff7a6b}
@keyframes aip{50%{transform:scale(.4);opacity:.35}}
.aist{display:flex;gap:11px;overflow-x:auto;margin:2px -18px 14px;padding:2px 18px 8px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.aist::-webkit-scrollbar{display:none}
.aia>.aist:last-child{margin-bottom:2px}
.aic{flex:none;width:116px;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;transition:transform .35s var(--spring)}
.aic .ap{aspect-ratio:2/3;border-radius:20px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.aic b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:9px;font-size:13.5px;font-weight:500;line-height:1.25;color:var(--tx)}
.aic small{display:block;margin-top:3px;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aic:active{transform:scale(.95)}
/* поле ввода */
.aicw{position:relative;z-index:5;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
body.kb .aicw{padding-bottom:10px}
.aicomp{display:flex;align-items:flex-end;gap:8px;min-height:58px;padding:6px 7px 6px 21px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));border:0;box-shadow:0 14px 44px rgba(0,0,0,.38);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);transition:box-shadow .5s,transform .5s var(--spring)}
#aiq{all:unset;display:block;flex:1;min-width:0;align-self:center;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.35;color:var(--tx);max-height:132px;padding:8px 0;overflow-y:auto;caret-color:var(--ac);-webkit-user-select:text;user-select:text;white-space:pre-wrap;word-break:break-word}
#aiq::placeholder{color:rgba(244,238,233,.6)}
.aisb{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;color:rgba(244,238,233,.9);background:transparent;transition:background .4s,transform .4s var(--spring),color .3s}
.aisb svg{grid-area:1/1;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:none}
.aisb[data-m="send"] .i-s,.aisb[data-m="idle"] .i-s,.aisb[data-m="stop"] .i-x{display:block}
.aisb[data-m="send"]{background:linear-gradient(160deg,var(--a1),var(--a2));color:var(--on,#fff);box-shadow:0 6px 20px var(--ag)}
.aisb[data-m="stop"]{background:rgba(255,255,255,.16)}
.aisb:active{transform:scale(.9)}
.aisb.rec{color:var(--al);background:rgba(255,255,255,.12)}
.aisb.rec .i-m path{transform-box:fill-box;transform-origin:center;animation:aiw 1s ease-in-out infinite}
.aisb.rec .i-m path:nth-child(2n){animation-delay:.25s}
.aisb.rec .i-m path:nth-child(3n){animation-delay:.5s}
@keyframes aiw{50%{transform:scaleY(.4)}}
/* настройки */
.aiset{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.aiset.open{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
.aiset .ap2{width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:32px 32px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));background:rgba(40,40,44,.5);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);transform:translateY(50px);transition:transform .65s var(--ease)}
.aiset.open .ap2{transform:none}
.aiset h2{margin:0;font-weight:300;font-size:32px;letter-spacing:-.035em;line-height:1.05}
.aiset .meta{margin:8px 0 14px}
.aiset p{margin:0 0 10px;color:rgba(244,238,233,.75);line-height:1.5;font-size:14.5px}
.aimod{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.aimod button{border:0;background:rgba(255,255,255,.07);color:var(--mu);font:inherit;font-size:13px;padding:9px 14px;border-radius:99px;transition:.35s}
.aimod button.on{color:var(--tx);background:rgba(255,255,255,.18)}
.aiset .btns{display:flex;gap:10px;margin-top:14px}
.aiset .lbl2{margin:16px 0 4px;color:var(--mu);font-size:13px}
@media(prefers-reduced-motion:reduce){.aibg i,.orb,.orb::before,.orb i,.aiw>*,.aia>*,.aiu,.ait,.ait i{animation:none!important}#ai{transition:opacity .2s}}
.aisb:disabled{opacity:.4}
.aisb[data-m="send"]:disabled{background:transparent;box-shadow:none}

function vis(sel){const out=[],seen=new Set();document.querySelectorAll(sel+" [data-id],"+sel+" [onclick*='openItem(']").forEach(el=>{let id=el.dataset&&el.dataset.id;if(!id){const m=/openItem\('([^']+)'/.exec(el.getAttribute("onclick")||"");id=m&&m[1]}if(!id||seen.has(id))return;
const r=el.getBoundingClientRect();if(r.width<24||r.height<24)return;

function ctx(){const L=topLayer(),sel=L.sel,inPg=sel==="#pg";

function sys(o,sh){const d=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
return `Ты — мини-ассистент приложения «Кинодневник». Пользователь вызвал тебя быстрым жестом прямо поверх экрана и задаёт вопрос о том, на что смотрит. Ты видишь то же самое, что и он: ниже описание экрана${sh.length?", а к вопросу приложены обложки и постеры в том же порядке, в каком они перечислены: "+sh.map((s,n)=>(n+1)+" — «"+s.i.t+"»").join(", "):""}.
Отвечай по-русски, очень коротко: 1–4 предложения, без заголовков и эмодзи, тепло и по делу. Слова «это», «вот этот», «он», «такое» относятся к главному объекту в фокусе, а если его нет — к самому заметному на экране. Если по обложке или описанию что-то не понять, скажи честно, не выдумывай. Не пиши id и ссылки. Если нужно найти что-то в каталоге, добавить в папку или отметить в дневнике, предложи открыть полный чат (кнопка со стрелкой в панели).

${o.lines.join("\n")}`}

cx.innerHTML=(l.length?`<div class="mc-th">${l.slice(0,3).map(thumb).join("")}</div>`:"")+tx}
function chips(o){return;const a=o.focus?(o.focus.k==="person"?["Чем он известен?","Лучшие работы","Что посмотреть с ним?"]:["О чём это?","Стоит ли смотреть?","Что похожее?"]):o.items.length?["Что из этого выбрать?","Чем они отличаются?","Что самое сильное?"]:["Что посмотреть вечером?","Подбери что-нибудь лёгкое"];
const g=$m("#mcsg");g.classList.remove("off");g.scrollLeft=0;g.innerHTML=a.map((t,n)=>`<button type="button" style="--n:${n}">${esc(t)}</button>`).join("")}
function setAns(html,cls){const a=$m("#mca"),w=$m("#mcaw");P.classList.toggle("chat",html!=null);if(html==null){w.classList.remove("has");return}
a.innerHTML=html;[...a.querySelectorAll(".mc-ans>*")].forEach((c,n)=>c.style.setProperty("--n",Math.min(n,6)));a.scrollTop=0;w.classList.add("has")}
function grow(){ta.style.height="auto";ta.style.height=Math.min(110,ta.scrollHeight)+"px";sb.classList.toggle("on",!!ta.value.trim()&&!MC.busy)}

async function ask(text){text=String(text||"").trim();if(!text||MC.busy)return;
if(!AI.key){ta.value="";grow();setAns(`<div class="mc-q">${esc(text)}</div><div class="mc-ans er"><p>Для ответов нужен ключ Gemini. Добавьте его в полном чате.</p><button class="mc-go" type="button" onclick="mcFull(1)">Открыть настройки</button></div>`);return}
const run=++MC.run;MC.busy=1;MC.ctl=new AbortController();const sig=MC.ctl.signal;
ta.value="";grow();think(1);
setAns(`<div class="mc-q">${esc(text)}</div><div class="mc-ans"><p class="mc-tk">Смотрю на экран…</p></div>`);
try{const o=MC.ctx=ctx(),sh=await shots(o);if(sig.aborted)return;

MC.h.push({role:"user",t:text},{role:"model",t});if(MC.h.length>12)MC.h.splice(0,MC.h.length-12);

}catch(e){if(run!==MC.run||e.name==="AbortError")return;ta.value=text;grow();

{const fb=$m("#mcfull");if(fb)fb.style.display=(typeof AI!=="undefined"&&AI.on)?"none":""}}

/* ---------- жест: потянуть вниз ---------- */
let g={on:0,x:0,y:0,t:0,mode:"",dy:0,lv:0,lt:0,ar:0};

else{g.on=0;return}}
if(g.mode==="pull"){if(e.cancelable)e.preventDefault();const pull=Math.max(0,dy-6),c=closedY();let y=c+pull*.92;if(y>0)y=22*Math.log1p(y/22);

{const w=Math.min(screen.width,screen.height),h=Math.max(screen.width,screen.height),ios=/iPhone/.test(navigator.userAgent);
