function avgColor1(u){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";
im.onload=()=>{try{const N=24,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");x.drawImage(im,0,0,im.width,im.height*.7,0,0,N,N);
const d=x.getImageData(0,0,N,N).data,B=Array.from({length:8},()=>[0,0,0,0]);
for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),df=mx-Math.min(r,g,b);
if(mx<.14||df<.07)continue;
let h=mx===r?((g-b)/df+6)%6:mx===g?(b-r)/df+2:(r-g)/df+4;
const k=Math.floor(h*60/45)%8,w=.2+df*.6,a=B[k];a[0]+=w;a[1]+=r*w;a[2]+=g*w;a[3]+=b*w}
let best=B[0];for(const a of B)if(a[0]>best[0])best=a;
if(best[0]<.5){res(["rgb(125,125,125)","rgb(36,36,36)"]);return}
let r=best[1]/best[0],g=best[2]/best[0],b=best[3]/best[0];
const k=Math.min(2.4,.92/Math.max(r,g,b,.01));r*=k;g*=k;b*=k;
const f=v=>Math.round(Math.min(255,v*255));
res([`rgb(${f(r)},${f(g)},${f(b)})`,`rgb(${f(r*.42)},${f(g*.42)},${f(b*.42)})`])}catch(e){res(null)}};
im.onerror=()=>res(null);im.src=u})}

/* Бегущие подсказки в поиске: плавная смена со сдвигом и размытием */
const PHQ=["Поиск фильмов и сериалов","Попробуйте «Интерстеллар»","Найдите любимого актёра","Комедии на вечер","Что-нибудь про космос","Детективы с неожиданным финалом","Сериал на выходные","Триллеры на ночь","Фильмы, которые все обсуждают","Режиссёр, жанр или год"];
let PHT=0;
function phStart(){const my=++PHT,el=document.querySelector(".ph");if(!el)return;
const alive=()=>my===PHT&&document.querySelector(".ph")===el,sl=ms=>new Promise(r=>setTimeout(r,ms));
let i=0;el.innerHTML="";const f=document.createElement("span");f.className="pi in";f.textContent=PHQ[0];el.appendChild(f);
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
(async()=>{while(alive()){await sl(3800);
while(document.hidden&&alive())await sl(600);
if(!alive())return;const inp=document.getElementById("q");
if(inp&&(inp.value||document.activeElement===inp))continue;
i=(i+1)%PHQ.length;const old=el.querySelector(".pi:not(.out)");
if(old){old.classList.remove("in");old.classList.add("out");await sl(620);old.remove()}
if(!alive())return;await sl(80);if(!alive())return;
const n=document.createElement("span");n.className="pi in";n.textContent=PHQ[i];el.appendChild(n)}})()}

let o=document.getElementById("dtr");if(!o){o=document.createElement("div");o.id="dtr";o.className="dtr";o.onclick=e=>{if(e.target.classList.contains("trx"))closeTree()};document.body.appendChild(o)}
const X=u=>50+u*105,Y=r=>24+r*140,M={};T.n.forEach(n=>M[n[0]]={x:X(n[4]),y:Y(n[5]),r:n[5]});
const W=X(5.5),H=Y(9)+130;let ps="";

const col=FAMC[T.n.find(n=>n[0]===a.split("+")[0])[3]];
ps+=`<path pathLength="1" ${d?'class="d"':""} style="--r:${r+(couple?.3:0)};stroke:${col}" d="M${sx} ${sy}V${my}H${c.x}V${ey}"/>`});
const nodes=T.n.map(n=>`<div class="dn" data-a="${n[2]}" style="--r:${n[5]};--fc:${FAMC[n[3]]};left:${X(n[4])-48}px;top:${Y(n[5])}px"><div class="av">${n[1][0]}</div><b>${n[1]}</b><small>${n[2]}</small></div>`).join("");

o.scrollTop=0;requestAnimationFrame(()=>o.classList.add("open"));
if(KEY)treePhotos(o)}

add(DET&&DET.credits&&DET.credits.cast);
try{const d=await api("/"+mtype(cur.id)+"/"+raw(cur.id)+"/aggregate_credits");add(d.cast)}catch(e){}
o.querySelectorAll(".dn").forEach(n=>{const p=m[n.dataset.a];if(p){const u="https://image.tmdb.org/t/p/w185"+p,im=new Image();im.onload=()=>{const a=n.querySelector(".av");a.style.backgroundImage=`url(${u})`;a.textContent=""};im.src=u}})}
