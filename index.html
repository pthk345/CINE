<style>
:root{--bg:#0a0605;--tx:#f4eee9;--mu:rgba(244,238,233,.52);--ac:#ff7a2f;--a1:#ff8a3d;--a2:#d4400f;--al:#ffb27a;--ag:rgba(255,106,31,.35);--ag2:rgba(255,138,61,.65);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--ln:transparent;--c1:#e8660f;--c2:#c81c00;--g1:#e8660f;--g2:#c81c00;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.25,.5,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.page.cc{transition:--c1 .6s ease,--c2 .6s ease}
body.fx #view .glass,body.fx .dock.glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.poster:active,.row:active,.hc:active{transform:scale(.965);transition-duration:.15s}

.cover.c0{z-index:-1;-webkit-mask-image:none;mask-image:none}
.cover.c0::after{display:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:transparent;color:var(--tx);font-family:"Inter Tight",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:120px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#030201}
.o{position:absolute;border-radius:50%;opacity:.85;will-change:transform}
.o1{width:80vmax;height:70vmax;right:-40vmax;bottom:-24vmax;background:radial-gradient(circle,var(--g1),transparent 66%);animation:d2 20s ease-in-out infinite alternate;opacity:.5}
.o,.o2,.o3{display:none!important}

@keyframes d1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vmax,10vmax) scale(.9)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--ln);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.chip,.mark,.row.glass,.ep.glass{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.chip,.mark{background:rgba(16,9,7,.42)}
.row.glass,.ep.glass{background:rgba(255,255,255,.09)}
main{max-width:720px;margin:0 auto}
.hero{padding:34px 22px 10px}
.hero small{color:var(--mu);font-size:14px;letter-spacing:.02em}

.seg{position:relative;display:inline-flex;margin:22px 22px 6px;padding:4px;border-radius:99px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mu);font:inherit;font-size:14px;padding:8px 13px;border-radius:99px;transition:color .4s var(--ease),transform .45s var(--ease)}
.seg button.on{color:var(--tx)}
.seg button:active,.chipb:active{transform:scale(.94)}
.sl{position:absolute;left:0;top:0;width:0;height:0;border-radius:99px;background:var(--glass2);border:0;outline:0;box-shadow:none;pointer-events:none;opacity:0;z-index:0;will-change:transform,width;transition:transform .55s cubic-bezier(.32,.72,0,1),width .55s cubic-bezier(.32,.72,0,1),height .55s cubic-bezier(.32,.72,0,1),opacity .25s}
.seg.glass,.secs{box-shadow:none;border-color:transparent}
.seg.glass{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.seg .sl{background:transparent}
.seg button,.chipb{outline:0;-webkit-appearance:none;appearance:none}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}}
.secs.fi{animation:fi .5s var(--ease) both}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px 22px}

.in{animation:up .7s var(--ease) both;animation-delay:calc(min(var(--i,0),10)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}
.poster{aspect-ratio:3/4;border-radius:26px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;cursor:pointer;transition:transform .5s var(--ease)}
.poster:active{transform:scale(.97)}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.65))}
.poster::after{content:"";position:absolute;width:90%;aspect-ratio:1;border-radius:50%;right:-30%;top:-18%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),transparent 62%);filter:blur(14px);opacity:.55}
.poster>*{position:relative;z-index:1}
.poster b{font-weight:500;font-size:18px;line-height:1.15;letter-spacing:-.02em}
.poster small{color:rgba(255,255,255,.7);margin-top:4px;font-size:12.5px}
.chip{position:absolute!important;top:12px;left:12px;font-size:11px;padding:5px 10px;border-radius:99px;color:#fff;letter-spacing:.03em}
.mark{position:absolute!important;top:12px;right:12px;font-size:12px;padding:5px 10px;border-radius:99px;color:#ffd9bd}
.stat{display:flex;padding:30px 22px 8px;gap:8px}
.stat div{flex:1}
.stat b{display:block;font:300 38px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.04em}
.stat span{color:var(--mu);font-size:12.5px}

.row:active{transform:scale(.98)}

.row .poster::after{display:none}
.row h3{margin:0;font-weight:500;font-size:16px;letter-spacing:-.02em}
.row p{margin:3px 0 0;color:var(--mu);font-size:13px;line-height:1.35}
.stars{color:var(--al);letter-spacing:3px;font-size:13px;margin-top:4px}
.empty{text-align:center;color:var(--mu);padding:70px 40px;line-height:1.5}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
.pill{position:relative;display:flex;width:min(300px,calc(100% - 78px));padding:5px;border-radius:99px}
.pill .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:99px;background:var(--glass2);transition:transform .6s var(--ease)}
.pill button{position:relative;flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13.5px;padding:13px 0;transition:color .4s}
.pill button.on{color:var(--tx)}
.fab{width:56px;height:56px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:var(--ac);transition:transform .5s var(--ease)}
body.nograd .bg>.o{display:none}
body.nograd .bg{background:#030201}
.hero h1{cursor:pointer}
.sws{display:flex;flex-wrap:wrap;gap:14px;margin:18px 4px 22px}
.sw{width:38px;height:38px;border-radius:50%;border:0;padding:0;position:relative;transition:transform .3s var(--ease)}
.sw:active{transform:scale(.9)}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--tx)}
.sw.cust{background:conic-gradient(#f55,#fb4,#6d6,#4cf,#86f,#f5a,#f55)}
.sw.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
.row2{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:0 4px}
.tgl{width:52px;height:32px;border-radius:99px;border:0;padding:0;background:var(--glass2);position:relative;transition:background .3s}
.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.tgl.on{background:var(--a2)}.tgl.on i{transform:translateX(20px)}
.fab svg{width:28px;height:28px;display:block;fill:currentColor}
.fab:active{transform:scale(.9) rotate(40deg)}
.trl{display:flex;align-items:center;gap:10px;margin:0 auto 18px;padding:13px 26px;border:0;border-radius:99px;font:inherit;font-size:15px;font-weight:500;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px var(--ag);transition:transform .2s var(--ease)}
.trl span{font-size:12px}.trl:active{transform:scale(.95)}
.trv{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.32,.72,0,1)}
.trv.open{opacity:1;pointer-events:auto}
.trf{width:100%;max-width:760px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 70px rgba(0,0,0,.6);transform:scale(.94);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.trv.open .trf{transform:none}
.trf iframe{width:100%;height:100%;border:0;display:block}
.trx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;border:0;color:#fff;font-size:16px;background:rgba(255,255,255,.14)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:32px 32px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));background:rgba(28,14,9,.55);transform:translateY(60px);transition:transform .7s var(--ease)}
.sheet.open .panel{transform:none}
.panel h2{margin:0;font-weight:300;font-size:34px;letter-spacing:-.035em;line-height:1.05}
.meta{color:var(--mu);font-size:14px;margin:8px 0 14px}
.panel p{color:rgba(244,238,233,.78);line-height:1.5;margin:0}
.rate{display:flex;gap:6px;margin:22px 0 16px;font-size:36px;color:#fff}
.rate span{position:relative;opacity:.22;transition:.4s var(--ease);cursor:pointer}
.rate span.f{opacity:1;color:var(--al)}
.rate span:active{transform:scale(1.3)}
@keyframes starPop{0%{transform:scale(.55) rotate(-35deg);opacity:.2}55%{transform:scale(1.5) rotate(10deg);opacity:1}80%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.rate span.pop,.es span.pop{animation:starPop .65s var(--ease) var(--d,0ms) backwards}
@keyframes btnPop{0%{transform:scale(.9)}45%{transform:scale(1.06)}75%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes btnRing{from{box-shadow:0 0 0 0 var(--ag2);opacity:1}to{box-shadow:0 0 0 22px transparent;opacity:0}}
@keyframes btnSheen{from{background-position:100% 0}to{background-position:0% 0}}
.btn{position:relative}
.btn.pop{animation:btnPop .6s var(--ease)}
.btn.pop::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:btnRing .7s ease-out forwards}
.btn.pop::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%) 100% 0/250% 100% no-repeat;animation:btnSheen .8s var(--ease) forwards}
.btns{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--ln);background:var(--glass);color:var(--tx);font:inherit;font-size:15px;padding:14px;border-radius:99px;transition:.4s var(--ease)}
.btn.on{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 24px var(--ag)}
textarea{width:100%;min-height:84px;margin-top:12px;border-radius:22px;border:1px solid var(--ln);background:var(--glass);color:var(--tx);padding:14px 16px;font:inherit;font-size:15px;resize:none;outline:none}
textarea{font-size:16px}
textarea::placeholder{color:var(--mu)}
.save{width:100%;margin-top:12px;background:#f4eee9;color:#1a0a05;font-weight:600;border:0;box-shadow:none}
.search{display:flex;align-items:center;gap:10px;margin:20px 22px 0;padding:0 18px;height:50px;border-radius:99px;color:var(--mu)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mu)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.foot{text-align:center;padding:10px 22px 30px;color:var(--mu);font-size:12px}
input.k{width:100%;margin-top:16px;height:50px;border-radius:99px;border:0;background:var(--glass);color:var(--tx);padding:0 20px;font:inherit;font-size:16px;outline:none}
.poster.im::after{display:none}
.poster.im::before{background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85))}
.row,.panel,.ep{box-shadow:none}
.page{position:fixed;inset:0;z-index:30;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;pointer-events:none;opacity:0;transition:opacity .38s cubic-bezier(.32,.72,0,1)}
.page::before{content:"";position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .5s cubic-bezier(.32,.72,0,1);background:radial-gradient(130% 70% at 114% 88%,var(--c1) 0%,var(--c2) 42%,transparent 76%),#030201}
.page.open,.page.closing{visibility:visible}
.page.closing::before{transition-duration:.4s}
.page.open{pointer-events:auto;opacity:1}
.page.open::before{opacity:1}
@property --mk{syntax:"<number>";inherits:true;initial-value:1}
.page{--rb:.14s}
@keyframes rvUp{from{opacity:0}}
.rv{animation:rvUp .45s ease-out both;animation-delay:calc(var(--i,0)*30ms + var(--rb,0s))}
.page.rs #pgmy,.page.rs #pgeps{animation:rvUp .45s ease-out .18s both}
#pgmore>*{animation:rvUp .45s ease-out both}
.fly{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform,clip-path,opacity;z-index:40;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%}
#list{transition:opacity .35s var(--ease),transform .5s var(--ease)}
#list.sw{opacity:.3;transform:scale(.985)}
.pgin{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(min(82vh,880px) - 130px + env(safe-area-inset-top,0px)) 22px calc(60px + env(safe-area-inset-bottom,0px))}
.back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:18px;width:46px;height:46px;border-radius:50%;border:0;color:var(--tx);font-size:28px;line-height:1;padding:0 0 4px;z-index:2}
.back.play{left:auto;right:18px;font-size:17px;padding:0 0 0 3px;display:none}
.back.play.on{display:block}
.pgin h2{margin:0;font-weight:300;font-size:38px;letter-spacing:-.035em;line-height:1.05;text-align:center;text-shadow:0 2px 28px rgba(0,0,0,.65)}
.pgin .meta{text-align:center;color:var(--mu);font-size:14px;margin:10px 0 16px}
.cover{position:absolute;top:0;left:0;right:0;height:min(82vh,880px);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 58%*var(--mk)),rgba(0,0,0,.55) calc(100% - 30%*var(--mk)),transparent 100%);mask-image:linear-gradient(180deg,#000 calc(100% - 58%*var(--mk)),rgba(0,0,0,.55) calc(100% - 30%*var(--mk)),transparent 100%);transform-origin:0 0}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 28%);opacity:var(--mk)}
.cb{opacity:var(--mk)}
.cover{overflow:hidden}
.cb{position:absolute;inset:0;background-size:cover!important;background-position:center top!important}
.cb.b1{filter:blur(7px);-webkit-mask-image:linear-gradient(180deg,transparent 45%,#000 72%);mask-image:linear-gradient(180deg,transparent 45%,#000 72%)}
.cb.b2{filter:blur(20px);-webkit-mask-image:linear-gradient(180deg,transparent 66%,#000 88%);mask-image:linear-gradient(180deg,transparent 66%,#000 88%)}
.tm{display:flex;align-items:baseline;gap:10px;width:max-content;margin:0 auto 18px;padding:12px 22px 14px;border-radius:99px;color:var(--mu);font-size:13px;line-height:1}
.tm b{font-size:20px;font-weight:500;color:var(--tx);line-height:1}
.tm i{font-style:normal;letter-spacing:.06em}
.tm span::before{content:"";display:inline-block;width:1px;height:12px;background:var(--mu);opacity:.4;margin-right:10px;vertical-align:-1px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.dates div{padding:2px 4px;font-size:14px}
.dates span{display:block;color:var(--mu);font-size:12px;margin-bottom:3px}
.desc{color:rgba(244,238,233,.78);line-height:1.55;margin:0}
.lbl{color:var(--mu);font-size:13px;margin:28px 0 8px;letter-spacing:.03em}
.seas{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chipb{position:relative;z-index:1;flex:none;border:0;background:var(--glass);color:var(--mu);font:inherit;font-size:14px;padding:9px 16px;border-radius:99px;transition:color .4s var(--ease),background .4s var(--ease),transform .45s var(--ease)}
.chipb.on{background:var(--glass2);color:var(--tx)}
.ep{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin:8px 0;border-radius:20px}
.et{min-width:0}.et b{display:block;font-weight:500;font-size:15px}.et small{color:var(--mu);font-size:12px}
.es{flex:none;font-size:20px;display:flex}
.es span{opacity:.22;padding:2px;cursor:pointer;transition:.3s var(--ease)}
.es span.f{opacity:1;color:var(--al)}
.secs{position:relative;padding:10px 22px 4px;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.secs .chipb,.secs .chipb.on{background:transparent;border:0;outline:0;box-shadow:none}
.secs .sl{background:rgba(255,255,255,.16);border:0;outline:0;box-shadow:none}
.gchips{display:flex;flex-wrap:wrap;gap:8px}

.gchips .chipb.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.yrs{display:flex;gap:10px}
.yrs input.k{margin-top:0;text-align:center}
.rng{width:100%;accent-color:#ff7a2f;margin:6px 0 0}
.panel .lbl{margin:22px 0 10px}
.hrow{display:flex;gap:12px;overflow-x:auto;margin:0 -22px;padding:2px 22px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hrow::-webkit-scrollbar{display:none}
.hc{flex:none;width:108px;cursor:pointer;transition:transform .5s var(--ease)}
.hc:active{transform:scale(.96)}
.hc i{display:flex;align-items:center;justify-content:center;aspect-ratio:2/3;border-radius:18px;background-color:rgba(255,255,255,.08);background-size:cover;background-position:center top;font-style:normal;font-size:28px;color:var(--mu)}
.hc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px;font-size:12.5px;font-weight:500;line-height:1.25;letter-spacing:-.01em}
.hc small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.ac{width:84px;text-align:center}
.hc.ac i{aspect-ratio:1;border-radius:50%}

.bio.cl{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><i class="o o1"></i><i class="o o2"></i><i class="o o3"></i></div>
<div class="grain"></div>
<main id="view"></main>

const NATIVE=window.CSS&&CSS.supports&&CSS.supports("corner-shape","squircle");
const SQC=new Map();
function sqPath(el,w,h){
if(!w||!h||(el._w===w&&el._h===h))return;el._w=w;el._h=h;
const key=w+"x"+h+"|"+el._r.join(",");let p=SQC.get(key);

const a=2/5,N=14,pts=[];
const cr=[[0,0,-1,-1],[1,0,1,-1],[1,1,1,1],[0,1,-1,1]];
el._r.forEach((r,k)=>{
const e=Math.min(r*1.3,w/2,h/2),[fx,fy,sx,sy]=cr[k],cx=fx?w-e:e,cy=fy?h-e:e;
if(e<1){pts.push((fx?w:0)+"px "+(fy?h:0)+"px");return}
for(let i=0;i<=N;i++){const t=i/N*Math.PI/2,c=Math.pow(Math.cos(t),a),s=Math.pow(Math.sin(t),a);
let x,y;
if(k===0){x=cx-e*c;y=cy-e*s}else if(k===1){x=cx+e*s;y=cy-e*c}else if(k===2){x=cx+e*c;y=cy+e*s}else{x=cx-e*s;y=cy+e*c}
pts.push(x.toFixed(2)+"px "+y.toFixed(2)+"px")}
});
p="polygon("+pts.join(",")+")";if(SQC.size>300)SQC.clear();SQC.set(key,p)}
el.style.clipPath=p}

els.forEach((el,n)=>{el._r=rs[n];el.dataset.sq=1;

async function loadGenres(){if(Object.keys(GEN).length)return;

async function fetchPage(p){const s=q.trim(),cap5=n=>Math.min(n||1,500);
if(flt==="actor"){const d=s?await api("/search/person",{query:s,include_adult:"false",page:p}):await api("/person/popular",{page:p});
